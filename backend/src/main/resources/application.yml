server:
  port: 8080

spring:
  application:
    name: menstrual-tracker
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

rate-limiter:
  permits-per-second: 10.0
  warmup-seconds: 5

wechat:
  app-id: test_app_id
  app-secret: test_app_secret

admin:
  bootstrap:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}

app:
  security:
    trusted-proxies: ${TRUSTED_PROXIES:127.0.0.1,::1}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [%X{traceId}] - %msg%n"
  level:
    com.menstrualtracker: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
  show-actuator: false

